name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    # A test that throws before its `finishTest` leaves the widget tree
    # undisposed, and the pending timer wedges the whole file rather than
    # failing it. Without a cap that costs the runner's six-hour default and
    # reads as a stuck queue, not a broken test.
    timeout-minutes: 30
    steps:
      # The design system lives in packages/system_design as a submodule;
      # without this the checkout is empty there and `pub get` fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # actions/checkout leaves each submodule at the commit the parent's
      # gitlink records. This moves them onto the branch `.gitmodules` names
      # (`main`) and takes its tip, which is what `melos run set-up` does on a
      # developer's Mac — so CI and a laptop build the same design system
      # instead of diverging silently until someone notices.
      #
      # The cost is real: a build is no longer reproducible from its commit,
      # and a broken push to the design system's `main` breaks this workflow
      # with nothing in this repo having changed.
      - name: Follow the design system's branch
        run: git submodule update --remote --recursive

      # Catches a checkout that succeeded but left the submodule empty. It
      # does NOT catch a gitlink whose commit was never pushed — that fails
      # the step above with "not our ref" and nothing here runs. There is no
      # CI-side fix for that one: push the submodule before the parent.
      - name: Verify the submodule checked out
        run: |
          if [ ! -f packages/system_design/pubspec.yaml ]; then
            echo "::error::packages/system_design is empty. The gitlink this"
            echo "::error::commit records is probably not pushed — push the"
            echo "::error::submodule first, then the parent."
            exit 1
          fi

      # Drift tests open real SQLite databases on the host.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Same steps a developer gets from `melos run set-up`, minus the iOS and
      # env parts CI has no use for. Melos is pinned to the version in
      # pubspec.yaml so the local and global installs cannot disagree.
      #
      # `dart pub global activate` drops the binary in ~/.pub-cache/bin, which
      # is not on the runner's PATH — without the second line every `melos`
      # step below dies with "command not found".
      - name: Install melos
        run: |
          dart pub global activate melos 6.3.3
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate
        run: sh packages/system_design/tool/gen.sh

      - name: Analyze (zero warnings allowed)
        run: sh packages/system_design/tool/analyze.sh

      - name: Test
        run: sh packages/system_design/tool/test.sh

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
