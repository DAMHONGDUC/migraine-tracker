name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      # The design system lives in packages/system_design as a submodule;
      # without this the checkout is empty there and `pub get` fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      # Drift tests open real SQLite databases on the host.
      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # Same steps a developer gets from `melos run setup`, minus the iOS and
      # env parts CI has no use for. Melos is pinned to the version in
      # pubspec.yaml so the local and global installs cannot disagree.
      - name: Install melos
        run: dart pub global activate melos 6.3.3

      - name: Bootstrap
        run: melos bootstrap

      - name: Generate
        run: melos run gen

      - name: Analyze (zero warnings allowed)
        run: melos run analyze

      - name: Test
        run: melos run test

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
