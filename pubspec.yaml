name: migraine_tracker
description: "BaroEase — migraine tracker with barometric pressure alerts."
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: ^3.12.2

dependencies:
  auto_size_text: ^3.0.0
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.6
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  drift: 2.34.0
  drift_flutter: ^0.3.0
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.2
  flutter_hooks: ^0.21.3+1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  health: ^3.0.6
  home_widget: ^0.9.3
  hooks_riverpod: ^3.3.2
  http: ^1.6.0
  intl: 0.20.2
  liquid_glass_renderer: ^0.2.0-dev.4
  logger: ^2.5.0
  material_symbols_icons: ^4.2960.0
  meta: ^1.18.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: ^12.0.1
  printing: ^5.15.0
  purchases_flutter: ^10.7.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  simple_icons: ^16.23.0
  step_progress: ^2.7.1
  # The shared design system. Its own git repo, checked out here as a
  # submodule — tokens, theme and string-free widgets live there, not in
  # lib/core.
  system_design:
    path: packages/system_design
  table_calendar: ^3.2.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # The task runner. Melos 6 on purpose — see melos.yaml for why.
  # Pinned exactly: the global install and this one must be the same version,
  # or melos launches one version's code against the other's asset templates
  # and bootstrap dies on a missing .tmpl file.
  melos: 6.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/noto_sans/
    - assets/icons/
    - assets/images/
