name: migraine_tracker
description: "BaroEase — migraine tracker with barometric pressure alerts."
publish_to: 'none'
version: 1.1.0+32

environment:
  sdk: ^3.12.2

dependencies:
  auto_size_text: ^3.0.0
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.6
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  drift: 2.34.0
  drift_flutter: ^0.3.0
  firebase_analytics: ^12.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.2
  flutter_hooks: ^0.21.3+1
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  health: ^3.0.6
  home_widget: ^0.9.3
  hooks_riverpod: ^3.3.2
  in_app_review: ^2.0.12
  intl: 0.20.2
  liquid_glass_renderer: ^0.2.0-dev.4
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  material_symbols_icons: ^4.2960.0
  meta: ^1.18.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: ^12.0.1
  printing: ^5.15.0
  purchases_flutter: ^10.7.0
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  simple_icons: ^16.23.0
  step_progress: ^2.7.1
  # The shared design system. Its own git repo, checked out here as a
  # submodule — tokens, theme and string-free widgets live there, not in
  # lib/core.
  system_design:
    path: packages/system_design
  table_calendar: ^3.2.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  # Generates every launcher icon size from one source PNG. Build-time only —
  # it writes files into ios/ and android/ and ships nothing into the app.
  # Config is the `flutter_launcher_icons:` block at the bottom of this file.
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # The task runner. Melos 6 on purpose — see melos.yaml for why.
  # Pinned exactly: the global install and this one must be the same version,
  # or melos launches one version's code against the other's asset templates
  # and bootstrap dies on a missing .tmpl file.
  melos: 6.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/noto_sans/
    - assets/icons/
    - assets/images/

# Launcher icons. Regenerate with:
#   dart run flutter_launcher_icons
# after replacing image_path. Submission 1.0(11) was rejected under App Store
# 2.3.8 for still shipping the default Flutter logo, so the generated files ARE
# committed — a build made from a fresh clone without running this must not
# quietly go out with placeholders again.
#
# CHECK `git diff ios/Runner.xcodeproj/project.pbxproj` AFTER EVERY RUN AND
# REVERT IT. v0.14.4 writes the value `AppIcon` into
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS, which is a
# BOOLEAN setting — the right value in the wrong key, and in only two of the
# three build configurations. The key it meant is
# ASSETCATALOG_COMPILER_APPICON_NAME, which this project already sets to
# AppIcon in all three. Nothing here needs the tool to touch the pbxproj at
# all, so the whole diff is discardable: `git checkout -- ios/Runner.xcodeproj`.
#
# Contents.json and the icon PNGs are generated — the tool owns them. It
# minifies Contents.json onto one line and adds the legacy iOS 6/7 sizes (50,
# 57, 72). Both are ugly and both are harmless; do not hand-tidy them, because
# the next run puts them straight back.
flutter_launcher_icons:
  image_path: "assets/images/final_app_icon.png"

  ios: true
  # MANDATORY, not a preference. App Store Connect rejects the 1024 marketing
  # icon if it carries an alpha channel — `ITMS-90717 Invalid App Store Icon …
  # can't be transparent nor contain an alpha channel` — and the upload fails
  # after the whole build. The source PNG has alpha, so this flattens it onto
  # background_color_ios first.
  remove_alpha_ios: true
  # The app's own background (AppColors.background), so flattening cannot show
  # a seam against the artwork. Never white: the theme is dark by default and
  # the users are photophobic.
  background_color_ios: "#0C0C0E"

  # Legacy mipmaps only, deliberately. Adaptive icons reserve the outer 18 of
  # 108dp for the launcher's own mask, so a full-bleed design like this one
  # loses its edges — here that is the teal scale down the left side. Doing it
  # properly needs a separately padded foreground asset, which is Android
  # polish, and this repo ships iOS first.
  android: "ic_launcher"
