<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 122" width="100" height="122">
  <!-- The same head seen from behind, for HeadLocation.back. Identical
       silhouette, ears and volume to head_front.svg so the flip between the
       two reads as one head turning; the face is swapped for a hair mass,
       which is the only cue telling the user which way it faces.
       Same constraints as the front file: dark-mode palette baked in, no
       filters, no <use>, silhouette repeated inline. -->
  <defs>
    <clipPath id="headClip">
      <path d="M50 0 C83 2.44 98 36.6 94 56.12 C91 80.52 76 113.46 50 122 C24 113.46 9 80.52 6 56.12 C2 36.6 17 2.44 50 0 Z"/>
    </clipPath>
    <radialGradient id="volume" gradientUnits="userSpaceOnUse" cx="37.5" cy="33.6" r="110">
      <stop offset="0" stop-color="#A594F9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A594F9" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="50" cy="61" r="52"
      gradientTransform="translate(50 61) scale(1 1.22) translate(-50 -61)">
      <stop offset="0.60" stop-color="#0E0E10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E0E10" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="specular" gradientUnits="userSpaceOnUse" cx="37" cy="23.2" r="30">
      <stop offset="0" stop-color="#E4E2E8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E4E2E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="5" cy="61" rx="4.6" ry="7.2" fill="#A594F9" fill-opacity="0.10" stroke="#A594F9" stroke-opacity="0.5" stroke-width="1.2"/>
  <ellipse cx="95" cy="61" rx="4.6" ry="7.2" fill="#A594F9" fill-opacity="0.10" stroke="#A594F9" stroke-opacity="0.5" stroke-width="1.2"/>

  <path d="M50 0 C83 2.44 98 36.6 94 56.12 C91 80.52 76 113.46 50 122 C24 113.46 9 80.52 6 56.12 C2 36.6 17 2.44 50 0 Z" fill="url(#volume)"/>

  <g clip-path="url(#headClip)">
    <path d="M50 0 C83 2.44 98 36.6 94 56.12 C91 80.52 76 113.46 50 122 C24 113.46 9 80.52 6 56.12 C2 36.6 17 2.44 50 0 Z" fill="url(#rim)"/>
    <circle cx="37" cy="23.2" r="30" fill="url(#specular)"/>

    <!-- Hair covers the crown and stops above the nape, so the lower
         silhouette still reads as skin and the head keeps a bottom. -->
    <path d="M0 -4 H100 V76 C88 96 71 104 50 104 C29 104 12 96 0 76 Z" fill="#A594F9" fill-opacity="0.18"/>
    <g fill="none" stroke="#A594F9" stroke-opacity="0.30" stroke-width="1.3" stroke-linecap="round">
      <path d="M50 12 C56 34 56 60 50 88"/>
      <path d="M30 18 C28 40 30 62 36 84"/>
      <path d="M70 18 C72 40 70 62 64 84"/>
    </g>
  </g>

  <path d="M50 0 C83 2.44 98 36.6 94 56.12 C91 80.52 76 113.46 50 122 C24 113.46 9 80.52 6 56.12 C2 36.6 17 2.44 50 0 Z" fill="none" stroke="#A594F9" stroke-opacity="0.55" stroke-width="1.4"/>
</svg>
