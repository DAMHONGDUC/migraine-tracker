# Melos 6 on purpose, not 7/8.
#
# Melos 7+ moves to Dart pub workspaces, and that costs this repo twice:
#   1. Melos 8's own dependencies cannot resolve alongside `drift_dev` — it
#      pulls `test: any`, drift_dev wants `analyzer ^13`, and no `test`
#      version satisfies both. The only way through is pinning `drift_dev`
#      exactly: a task runner dictating a codegen version. Melos 6 resolves
#      against `drift_dev: ^2.34.0` untouched.
#   2. It requires `resolution: workspace` inside packages/system_design,
#      which stops that package resolving in any project that is not itself
#      a workspace — exactly the portability the submodule exists for.
#
# Every melos since 3.0.0 needs `melos` in the root dev_dependencies, so that
# part is unavoidable either way. Revisit when drift_dev and melos stop
# fighting over `analyzer`.
name: baro_ease

packages:
  - .
  - packages/**

# melos 6.3.3 ships without the IntelliJ run-configuration templates it tries
# to write, so bootstrap crashes on `flutter_run_with_args.xml.tmpl`. Nothing
# here uses those files — this project runs from VS Code launch configs.
ide:
  intellij: false

# Each script is one line on purpose. Melos echoes the whole `run:` body
# before AND after every run, with no flag to turn it off, so a multi-line
# block buries the output it is meant to introduce. The bodies live in
# `tool/*.sh`, which also makes them lintable and runnable under dash — the
# shell melos actually uses on Linux, and the one macOS hides from you.
scripts:
  set-up:
    description: >
      Wipe build artefacts, then set up everything a clone needs.
      Safe to re-run.
    run: sh tool/set-up.sh

  deep-set-up:
    description: >
      set-up, plus Xcode's DerivedData. For a build failure the code cannot
      explain. Costs a full cold build afterwards.
    run: sh tool/deep-set-up.sh

  prepare-env-dev:
    description: >
      Copy env_assets/ into place for dev: both env/*.json, plus dev's
      google-services.json and GoogleService-Info.plist. Overwrites.
    run: sh tool/prepare-env.sh dev

  prepare-env-prod:
    description: >
      Same, with prod's native Firebase files instead. Both env/*.json are
      written either way — only the native pair differs.
    run: sh tool/prepare-env.sh prod

  gen:
    description: Regenerate localizations and build_runner output.
    run: sh tool/gen.sh

  build-ipa-prod:
    description: >
      Build the TestFlight/App Store IPA with env/prod.json attached.
      Never archive from Xcode — it cannot pass the config flag.
    run: sh tool/build-ipa.sh prod

  build-ipa-dev:
    description: >
      Same IPA with env/dev.json attached instead. One bundle id, so it
      lands in the same TestFlight app — bump the build number.
    run: sh tool/build-ipa.sh dev

  deploy-firebase:
    description: >
      Deploy firestore rules, indexes and functions. Confirms the project
      first — dev and prod share one, so this reaches real users.
    run: sh tool/deploy-firebase.sh

  analyze:
    description: Analyze every package. Must pass with zero findings.
    run: sh tool/analyze.sh

  test:
    description: Run the Flutter test suite.
    run: sh tool/test.sh

