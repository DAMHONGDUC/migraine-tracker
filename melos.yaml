# Melos 6 on purpose, not 7/8.
#
# Melos 7+ moves to Dart pub workspaces, and that costs this repo twice:
#   1. Melos 8's own dependencies cannot resolve alongside `drift_dev` — it
#      pulls `test: any`, drift_dev wants `analyzer ^13`, and no `test`
#      version satisfies both. The only way through is pinning `drift_dev`
#      exactly: a task runner dictating a codegen version. Melos 6 resolves
#      against `drift_dev: ^2.34.0` untouched.
#   2. It requires `resolution: workspace` inside packages/system_design,
#      which stops that package resolving in any project that is not itself
#      a workspace — exactly the portability the submodule exists for.
#
# Every melos since 3.0.0 needs `melos` in the root dev_dependencies, so that
# part is unavoidable either way. Revisit when drift_dev and melos stop
# fighting over `analyzer`.
name: baro_ease

packages:
  - .
  - packages/**

# melos 6.3.3 ships without the IntelliJ run-configuration templates it tries
# to write, so bootstrap crashes on `flutter_run_with_args.xml.tmpl`. Nothing
# here uses those files — this project runs from VS Code launch configs.
ide:
  intellij: false

# Each script is one line on purpose. Melos echoes the whole `run:` body
# before AND after every run, with no flag to turn it off, so a multi-line
# block buries the output it is meant to introduce. The bodies live in
# `packages/system_design/tool/*.sh`, which also makes them lintable and
# runnable under dash — the shell melos actually uses on Linux, and the one
# macOS hides from you.
scripts:
  set-up:
    description: >
      Wipe build artefacts, then set up everything a clone needs.
      Safe to re-run.
    run: sh packages/system_design/tool/set-up.sh

  deep-set-up:
    description: >
      set-up, plus Xcode's DerivedData. For a build failure the code cannot
      explain. Costs a full cold build afterwards.
    run: sh packages/system_design/tool/deep-set-up.sh

  prepare-env-dev:
    description: >
      Install dev's real config from env_assets/ into the six paths the build,
      the backend and fastlane read. Overwrites: this is how a checkout
      switches environment.
    run: sh packages/system_design/tool/prepare-env.sh dev

  prepare-env-prod:
    description: >
      The same, prod's files. Separate command, like the deploys it feeds, so
      pointing a checkout at prod is typed rather than passed as a flag.
    run: sh packages/system_design/tool/prepare-env.sh prod

  release-dev:
    description: >
      The whole dev release: dev config, the firebase deploy, then the
      TestFlight build. Runs start to finish unattended — nothing asks. It does
      not set up first; run `melos run set-up` when the tree needs it.
    run: sh packages/system_design/tool/release.sh dev

  release-prod:
    description: >
      The same against prod. Separate command, like the deploys it wraps, so a
      prod release is typed on purpose rather than passed as a flag.
    run: sh packages/system_design/tool/release.sh prod

  deploy-firebase-dev:
    description: >
      Deploy firestore rules, indexes and functions to the `dev` project.
      Optional target: `rules` or `functions`. Prints the resolved project id
      and does not ask; typing the environment is the decision.
    run: sh packages/system_design/tool/deploy-firebase.sh dev

  deploy-firebase-prod:
    description: >
      The same, against the `prod` alias. Separate command so a prod deploy is
      typed on purpose rather than inherited from whatever `firebase use` was
      left pointing at.
    run: sh packages/system_design/tool/deploy-firebase.sh prod

  gen-app-icon:
    description: >
      One source PNG to every icon: every launcher size, and the rounded
      launch screen copies for iOS and Android. Reads
      assets/images/app_icon.png and nothing else.
    run: sh packages/system_design/tool/gen-app-icon.sh

  gen-app-icon-strip-marker:
    description: >
      Erase the image generator's watermark from assets/images/app_icon.png,
      in place. Run once when new artwork arrives, then gen-app-icon.
    run: sh packages/system_design/tool/gen-app-icon-strip-marker.sh

  upload-ipa-dev:
    description: >
      Upload the IPA already in build/ios/ipa, without rebuilding. For a
      release that built and then failed to upload.
    run: sh packages/system_design/tool/upload-ipa.sh dev

  upload-ipa-prod:
    description: The same for prod.
    run: sh packages/system_design/tool/upload-ipa.sh prod
